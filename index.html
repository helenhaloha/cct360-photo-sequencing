<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Sequence — The Power of Sequencing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <p>CCT360 · Lab 3</p>
      <h1>The Power of Sequencing</h1>
    </header>

    <main>
      <section class="intro">
        <h2>One set of photos, two different stories.</h2>
        <p>
          This page uses the same three images in two different orders.
          Click a button to change the sequence.
        </p>
      </section>

      <section class="controls" aria-label="Sequence controls">
        <button class="sequence-button active" type="button" data-sequence="a">
          Sequence A
        </button>
        <button class="sequence-button" type="button" data-sequence="b">
          Sequence B
        </button>
      </section>

      <section class="story" aria-labelledby="story-title">
        <div class="story-heading">
          <p>Current story</p>
          <h2 id="story-title">Sequence A: A Normal Day</h2>
        </div>

        <div id="photo-sequence" class="photo-sequence">
          <!-- JavaScript will place the three image cards here. -->
        </div>
      </section>

    </main>

    <footer>CCT360 Lab 3 · Photo Sequencing</footer>
    <script src="script.js"></script>
  </body>
</html>
